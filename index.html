 else if(c.st=='pull'){const t=c.target,e=c.o;c.t+=dt;
  let dx=e.x-t.x,dz=e.z-t.z,l=Math.hypot(dx,dz);

  else{const sp=16*dt;const nx=t.x+dx/l*sp,nz=t.z+dz/l*sp;if(!blockedAt(nx,t.z))t.x=nx;if(!blockedAt(t.x,nz))t.z=nz;
   c.ang=Math.atan2(t.x-e.x,t.z-e.z);c.g.position.set(e.x,1,e.z);c.g.rotation.y=c.ang;const L=Math.max(.2,l);c.links.forEach((m,j)=>m.position.z=L*(j+1)/10);c.hook.position.z=L}}
 else{c.d-=40*dt;const L=Math.max(0,c.d);c.g.position.set(c.o.x,1,c.o.z);c.links.forEach((m,j)=>{m.position.z=L*(j+1)/10;m.visible=L>.3});c.hook.position.z=L;
